<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zone Report Parser</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/screens.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <button class="brand-lockup" data-route="dashboard" type="button" aria-label="WCIS home">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="brand-text"><strong>WCIS</strong><small>Collection desk</small></span>
          </button>

          <nav class="app-nav" aria-label="Main">
            <div class="nav-flow" role="list">
              <button class="nav-tab nav-home" data-route="dashboard" type="button"><span class="nav-label">Overview</span></button>
              <span class="nav-divider" aria-hidden="true"></span>
              <button class="nav-tab nav-step" data-route="upload" data-step="upload" type="button"><span class="nav-step-number" aria-hidden="true">1</span><span class="nav-label">Import</span><span class="nav-badge" data-nav-badge="upload"></span></button>
              <button class="nav-tab nav-step" data-route="results" data-step="results" type="button"><span class="nav-step-number" aria-hidden="true">2</span><span class="nav-label">Results</span><span class="nav-badge" data-nav-badge="results"></span></button>
              <button class="nav-tab nav-step" data-route="mapping" data-step="mapping" type="button"><span class="nav-step-number" aria-hidden="true">3</span><span class="nav-label">Fix matches</span><span class="nav-badge" data-nav-badge="mapping"></span></button>
              <button class="nav-tab nav-step" data-route="weekly" data-step="weekly" type="button"><span class="nav-step-number" aria-hidden="true">4</span><span class="nav-label">Weekly sheet</span><span class="nav-badge" data-nav-badge="weekly"></span></button>
            </div>
            <div class="nav-secondary">
              <button class="nav-tab" data-route="reports" type="button"><span class="nav-label">Analytics</span></button>
              <button class="nav-tab" data-route="map" type="button"><span class="nav-label">Map</span></button>
              <button class="nav-tab" data-route="zones" type="button"><span class="nav-label">Zones</span></button>
            </div>
          </nav>
        </div>
        <div id="periodBar" class="period-bar" aria-label="Collection period"></div>
      </header>

      <main id="appContent" class="main-content"></main>

      <footer class="app-footer">Runs entirely on this computer. Report text is never uploaded.</footer>
    </div>

    <div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>

    <script src="./vendor/xlsx/xlsx.full.min.js"></script>
    <script src="./vendor/leaflet/leaflet.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
